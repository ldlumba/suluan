name = "suluan-api-production"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# Owner-approved 2026-10-24: manager/admin manual pipeline controls permit the
# aligned durable fallback to run every three hours. Queue delivery remains
# immediate and primary; job bounds and quotas are unchanged.
[triggers]
crons = ["0 */3 * * *"]

[vars]
ALLOWED_DOMAINS = "ua.edu.ph"
ALLOWED_ORIGINS = "https://suluan-repository.pages.dev"
# Owner-approved external evaluation exception. Exact emails are stored only
# in the EVALUATION_EMAILS Worker secret; access ends at midnight Asia/Manila.
EVALUATION_ACCESS_EXPIRES_AT = "2026-11-30T16:00:00Z"

# Corpus/document embedding is conservative and independent of query use.
# The temporary 160-request backfill override (owner-approved 2026-10-15)
# was reverted on 2026-10-16 at 100% chunk coverage.
EMBEDDING_DAILY_REQUEST_LIMIT = "20"
EMBEDDING_DAILY_INPUT_LIMIT = "2000"

# Owner-approved production launch policy, 2026-10-14.
SEMANTIC_DAILY_REQUEST_LIMIT = "500"
SEMANTIC_USER_DAILY_REQUEST_LIMIT = "10"
SEMANTIC_SEARCH_MODE = "hybrid"
SEMANTIC_SCORING_MODE = "log_length_penalized_min"
SEMANTIC_MAX_SCORE = "0.36"
# Owner-approved 2026-10-16: retain 0.36 as the confident band and admit the
# same bounded, explicitly labeled exploratory band used in staging.
SEMANTIC_DISCOVERY_MAX_SCORE = "0.40"
SEMANTIC_AUTHENTICATED_ONLY = "true"

ASSISTANT_ACCESS_MODE = "all_authenticated"
ASSISTANT_RETRIEVAL_DAILY_REQUEST_LIMIT = "300"

# Manager/admin manual pipeline launcher. The public service accepts only
# short-lived, single-use tickets and its IAM identity can invoke only the two
# existing bounded production Jobs.
OPERATIONS_DISPATCHER_URL = "https://suluan-operations-production-804189788259.asia-southeast1.run.app/dispatch"
OPERATIONS_SERVICE_ACCOUNT = "suluan-operations-production@suluan-production.iam.gserviceaccount.com"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "suluan-production"

[[queues.producers]]
binding = "NOTIFICATIONS"
queue = "suluan-notifications-production"

[[queues.consumers]]
queue = "suluan-notifications-production"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "suluan-notifications-production-dlq"

[[queues.consumers]]
queue = "suluan-notifications-production-dlq"
max_batch_size = 5
max_retries = 3
