name = "suluan-api-staging"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# Owner-approved 2026-10-05: 5-minute scheduled recovery sweep in staging.
# Overlap is safe by atomic claim+lease. Stage 7 policy (owner-approved
# 2026-10-05): consumer max_retries 3, then the staging DLQ; the DLQ handler
# alerts REO_MAILBOX and always acknowledges. Cloud Run scheduling stays
# undeployed.
[triggers]
crons = ["*/5 * * * *"]

# Non-secret staging configuration only. The exact local frontend origin is
# intentionally separate from development. Never use a wildcard here.
[vars]
ALLOWED_DOMAINS = "ua.edu.ph"
ALLOWED_ORIGINS = "http://localhost:5174"
# Owner-approved temporary staging override (2026-10-08): accelerate the
# governed full-corpus document backfill without increasing the 2,000-input
# daily cost ceiling. Revert both overrides after 100% document coverage and
# the one isolated frozen-suite evaluation, or by 2026-10-15, whichever comes
# first. Production remains on code-owned defaults.
EMBEDDING_DAILY_REQUEST_LIMIT = "110"
EMBEDDING_DAILY_INPUT_LIMIT = "2000"

# Private staging storage. Browser access remains Worker-authorized only.
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "suluan-staging"

# Staging notification delivery uses the temporary UA Gmail OAuth sender
# (server-side secrets, log-adapter fallback when unconfigured). Queue
# consumption and the scheduled recovery sweep are enabled.
[[queues.producers]]
binding = "NOTIFICATIONS"
queue = "suluan-notifications-staging"

# Dead-letter queue (Stage 7): messages that exhaust max_retries move here
# instead of vanishing. Queues are created with `wrangler queues create`
# (not declared here). The worker consumes the DLQ with an alert-only
# handler that always acknowledges — see handleDeadLetters in src/index.ts.
[[queues.consumers]]
queue = "suluan-notifications-staging"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "suluan-notifications-staging-dlq"

[[queues.consumers]]
queue = "suluan-notifications-staging-dlq"
max_batch_size = 5
max_retries = 3
